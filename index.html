<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tariqdesign.com/">
  <link rel="canonical" href="https://tariqdesign.com/">
  <link rel="stylesheet" href="styles.css?v=20260805-1">
  <script defer src="script.js?v=20260805-1"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-header>
    <a class="brand" href="#about" aria-label="Home">
      <span data-site="name"></span>
      <span data-site="professionalTitle"></span>
    </a>

    <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-button>
      Menu
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Primary navigation" data-nav>
      <a class="is-active" href="#about" data-label="about"></a>
      <a href="#services" data-label="services"></a>
      <a href="#recognition" data-label="recognition"></a>
      <a href="#work" data-label="work"></a>
      <a href="#contact" data-label="contact"></a>
    </nav>
  </header>

  <main id="main">
    <p class="content-status" role="status" data-content-status hidden></p>

    <section class="about-section" id="about" aria-labelledby="about-title">
      <h1 class="visually-hidden" id="about-title" data-label="aboutHeading"></h1>
      <div class="about-lead" data-rich-text="mainPositioningStatement"></div>
      <div class="about-intro">
        <div data-rich-text="introduction"></div>
        <a class="about-work-link" data-link="behanceUrl" rel="noopener noreferrer" hidden></a>
      </div>
    </section>

    <section class="capabilities-section" id="services" aria-labelledby="services-title">
      <h2 id="services-title" data-label="capabilities"></h2>
      <div class="capabilities-list" data-list="capabilities"></div>
    </section>

    <section class="recognition-section" id="recognition" aria-labelledby="recognition-title">
      <h2 id="recognition-title" data-label="recognitionHeading"></h2>
      <ul class="recognition-list" aria-label="Selected recognition and publications" data-list="recognition"></ul>
    </section>

    <section class="expertise-section" aria-labelledby="expertise-title">
      <h2 id="expertise-title" data-label="expertise"></h2>
      <div class="expertise-list">
        <article data-optional-content="leadershipStatement">
          <h3 data-label="leadership"></h3>
          <p data-site="leadershipStatement"></p>
        </article>
        <article data-optional-content="pointOfViewText">
          <h3 data-label="pointOfView"></h3>
          <p data-site="pointOfViewText"></p>
        </article>
        <article data-optional-content="systemsStatement">
          <h3 data-label="systems"></h3>
          <p data-site="systemsStatement"></p>
        </article>
      </div>
      <div class="practice-context" data-practice-context hidden>
        <dl data-optional-list="markets">
          <dt data-label="markets"></dt>
          <dd data-list-text="markets"></dd>
        </dl>
        <dl data-optional-list="sectors">
          <dt data-label="sectors"></dt>
          <dd data-list-text="sectors"></dd>
        </dl>
      </div>
    </section>

    <section class="work-section" id="work" aria-labelledby="work-title">
      <h2 id="work-title" data-label="workHeading"></h2>
      <div class="engagements-list" data-list="engagements"></div>
      <a class="work-link" data-link="behanceUrl" rel="noopener noreferrer" hidden>
        <span data-site="privatePortfolioRequestText"></span>
        <span aria-hidden="true">↗</span>
      </a>
    </section>
  </main>

  <footer class="contact-section" id="contact" aria-labelledby="contact-title">
    <h2 id="contact-title" data-label="contactHeading"></h2>
    <div class="contact-content">
      <p data-site="footerText"></p>
      <div class="contact-links">
        <a data-link="email" hidden></a>
        <a data-link="linkedInUrl" rel="noopener noreferrer" hidden></a>
      </div>
    </div>
  </footer>
</body>
</html>
