media:
  - name: images
    label: Images
    input: assets/images/uploads
    output: /assets/images/uploads
    extensions: [webp, jpg, jpeg, png]
    categories: [image]
    rename: safe
  - name: videos
    label: Videos
    input: assets/videos/uploads
    output: /assets/videos/uploads
    extensions: [mp4, webm]
    categories: [video]
    rename: safe

settings:
  content:
    merge: true

content:
  - name: site
    label: General website content
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: professionalTitle
        label: Professional title
        type: string
        required: true
      - name: mainPositioningStatement
        label: Main positioning statement
        type: rich-text
        required: true
        options:
          format: html
          media: false
      - name: introduction
        label: Short introduction
        type: rich-text
        required: true
        options:
          format: html
          media: false
      - name: heroImages
        label: Additional lightbox images
        type: object
        description: Optional archive images shown after the grouped project images in the lightbox.
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: image
            label: Image
            type: image
            required: true
            options:
              media: images
              extensions: [webp, jpg, jpeg, png]
              rename: safe
          - name: alt
            label: Image description
            type: string
            description: Briefly describe the image for visitors using screen readers.
      - name: leadershipStatement
        label: Leadership statement
        type: text
      - name: pointOfViewText
        label: Point-of-view text
        type: text
      - name: systemsStatement
        label: Systems statement
        type: text
      - name: markets
        label: Markets
        type: string
        list: true
      - name: sectors
        label: Sectors
        type: string
        list: true
      - name: capabilities
        label: Core capabilities
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Capability
            type: string
            required: true
          - name: description
            label: Description
            type: text
      - name: recognition
        label: Recognition
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Publication or organisation
            type: string
            required: true
          - name: detail
            label: Recognition detail
            type: rich-text
            options:
              format: html
              media: false
      - name: email
        label: Email
        type: string
        pattern:
          regex: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
          message: Enter a valid email address.
      - name: linkedInUrl
        label: LinkedIn URL
        type: string
        pattern:
          regex: "^$|^https://([a-z]+\\.)?linkedin\\.com/.*$"
          message: Use a full LinkedIn URL beginning with https://.
      - name: behanceUrl
        label: Behance URL
        type: string
        pattern:
          regex: "^$|^https://(www\\.)?behance\\.net/.*$"
          message: Use a full Behance URL beginning with https://.
      - name: privatePortfolioRequestText
        label: Portfolio link text
        type: string
      - name: footerText
        label: Footer text
        type: text
      - name: labels
        label: Section labels
        type: object
        fields:
          - name: about
            label: About label
            type: string
          - name: capabilities
            label: Capabilities label
            type: string
          - name: recognition
            label: Recognition label
            type: string
      - name: seo
        label: Search and social sharing
        type: object
        fields:
          - name: title
            label: Browser and search title
            type: string
          - name: description
            label: Search description
            type: text
          - name: socialDescription
            label: Social sharing description
            type: text

  - name: engagements
    label: Selected engagements
    type: file
    path: content/engagements.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: clientOrProjectName
        label: Client or project name
        type: string
        required: true
      - name: sector
        label: Sector
        type: string
      - name: location
        label: Location
        type: string
      - name: year
        label: Year
        type: number
        options:
          min: 1900
          max: 2100
      - name: role
        label: Role
        type: string
      - name: description
        label: Project information
        type: rich-text
        description: Displayed beside the project name in the main work feed.
        options:
          format: html
          media: false
      - name: coverImage
        label: Cover image
        type: image
        options:
          media: images
          extensions: [webp, jpg, jpeg, png]
          rename: safe
      - name: supportingImages
        label: Lightbox supporting images
        type: image
        options:
          media: images
          multiple:
            max: 12
          unique: true
          extensions: [webp, jpg, jpeg, png]
          rename: safe
      - name: mediaBlocks
        label: Ordered mixed-media blocks
        type: block
        blockKey: type
        description: When blocks are added here, they replace the legacy cover and supporting images on the homepage. Drag blocks to control the exact project sequence.
        list:
          max: 24
          collapsible:
            collapsed: true
            summary: "{type} block {index}"
        blocks:
          - name: image
            label: Single image
            fields:
              - name: image
                label: Image
                type: image
                required: true
                options:
                  media: images
                  extensions: [webp, jpg, jpeg, png]
                  rename: safe
              - name: alt
                label: Image description
                type: string
                description: Briefly describe the image for visitors using screen readers.
          - name: video
            label: Looping video
            fields:
              - name: video
                label: MP4 or WebM video
                type: file
                required: true
                options:
                  media: videos
                  extensions: [mp4, webm]
                  categories: [video]
                  rename: safe
              - name: poster
                label: Fallback still image
                type: image
                required: true
                description: Shown while the video loads and whenever the MP4 cannot play.
                options:
                  media: images
                  extensions: [webp, jpg, jpeg, png]
                  rename: safe
              - name: description
                label: Video description
                type: string
                description: Short accessible description of the motion or content.
          - name: slider
            label: Image slider
            fields:
              - name: slides
                label: Slides
                type: object
                required: true
                list:
                  min: 2
                  max: 4
                  collapsible:
                    collapsed: true
                    summary: "Slide {index}"
                fields:
                  - name: image
                    label: Image
                    type: image
                    required: true
                    options:
                      media: images
                      extensions: [webp, jpg, jpeg, png]
                      rename: safe
                  - name: alt
                    label: Image description
                    type: string
                    description: Briefly describe the slide for visitors using screen readers.
      - name: displayOrder
        label: Order
        type: number
        required: true
        options:
          min: 0
      - name: published
        label: Published
        type: boolean
        required: true
